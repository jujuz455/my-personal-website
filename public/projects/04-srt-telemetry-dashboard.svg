<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.13  0 0 0 0 0.11  0 0 0 0 0.08  0 0 0 0.05 0"/>
    </filter>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="4.5" height="4.5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4.5" stroke="#211C15" stroke-width="0.55" opacity="0.5"/>
    </pattern>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#211C15"/></marker>
  </defs>

  <rect width="960" height="540" fill="#F2EBD9"/>
  <rect width="960" height="540" filter="url(#grain)"/>
  <rect x="14" y="14" width="932" height="512" fill="none" stroke="#211C15" stroke-width="1.4"/>
  <rect x="21" y="21" width="918" height="498" fill="none" stroke="#211C15" stroke-width="0.5"/>
  <g fill="#F2EBD9" stroke="#211C15" stroke-width="1">
    <rect x="10.5" y="10.5" width="7" height="7"/><rect x="942.5" y="10.5" width="7" height="7"/>
    <rect x="10.5" y="522.5" width="7" height="7"/><rect x="942.5" y="522.5" width="7" height="7"/>
  </g>

  <g fill="#211C15">
    <line x1="55" y1="57" x2="215" y2="57" stroke="#211C15" stroke-width="0.7"/>
    <line x1="745" y1="57" x2="905" y2="57" stroke="#211C15" stroke-width="0.7"/>
    <text x="480" y="62" text-anchor="middle" font-size="16" letter-spacing="2.5" style="font-variant:small-caps">Plate IV — SRT Telemetry Instruments</text>
    <line x1="400" y1="76" x2="560" y2="76" stroke="#211C15" stroke-width="0.6"/>
    <circle cx="480" cy="76" r="1.6"/>
  </g>

  <g filter="url(#rough)" stroke="#211C15" fill="none" stroke-linecap="round">
    <!-- instrument cards, double-bordered -->
    <g stroke="none">
      <rect x="63.5" y="133.5" width="250" height="210" fill="url(#hatch)"/>
      <rect x="358.5" y="133.5" width="250" height="210" fill="url(#hatch)"/>
      <rect x="653.5" y="133.5" width="250" height="210" fill="url(#hatch)"/>
    </g>
    <rect x="60" y="130" width="250" height="210" fill="#F2EBD9" stroke-width="1.1"/>
    <rect x="66" y="136" width="238" height="198" stroke-width="0.5"/>
    <rect x="355" y="130" width="250" height="210" fill="#F2EBD9" stroke-width="1.1"/>
    <rect x="361" y="136" width="238" height="198" stroke-width="0.5"/>
    <rect x="650" y="130" width="250" height="210" fill="#F2EBD9" stroke-width="1.1"/>
    <rect x="656" y="136" width="238" height="198" stroke-width="0.5"/>
    <!-- sparklines -->
    <polyline points="90,220 120,202 150,215 180,192 210,197 240,183 282,174" stroke-width="1.3"/>
    <polyline points="385,220 415,218 445,205 475,208 505,190 535,185 577,175" stroke-width="1.3"/>
    <polyline points="680,205 710,204 740,206 763,162 788,203 830,204 872,205" stroke="#9B2D20" stroke-width="1.5"/>
    <!-- timestamp bar -->
    <rect x="60" y="395" width="840" height="30" stroke-width="0.8"/>
  </g>

  <g fill="#211C15" text-anchor="middle" style="font-variant:small-caps">
    <text x="185" y="165" font-size="12" letter-spacing="1.5">R.T.T. — ms</text>
    <text x="480" y="165" font-size="12" letter-spacing="1.5">Bandwidth — Mbps</text>
    <text x="775" y="165" font-size="12" letter-spacing="1.5">Packet loss — %</text>
  </g>
  <g fill="#211C15" text-anchor="middle" font-size="42">
    <text x="185" y="305">42</text>
    <text x="480" y="305">8.6</text>
    <text x="775" y="305" fill="#9B2D20">0.4</text>
  </g>
  <text x="480" y="414" text-anchor="middle" font-size="10.5" font-style="italic" fill="#211C15">observed 18 Sept. 2026, 14:32:07 UTC — polling interval, one second</text>

  <g fill="#211C15" font-size="14" text-anchor="middle">
    <text x="76" y="124">&#9312;</text>
    <text x="371" y="124">&#9313;</text>
    <text x="666" y="124">&#9314;</text>
  </g>

  <g>
    <rect x="60" y="442" width="530" height="70" fill="none" stroke="#211C15" stroke-width="0.6"/>
    <text x="74" y="461" font-size="10" letter-spacing="2" fill="#211C15" style="font-variant:small-caps">Legend.</text>
    <g fill="#211C15" font-size="10" letter-spacing="0.3">
      <text x="74" y="477">&#9312;&#160;&#160;Round-trip time&#160;&#160;&#160;&#9313;&#160;&#160;Estimated link bandwidth&#160;&#160;&#160;&#9314;&#160;&#160;Packet-loss ratio</text>
      <text x="74" y="492">All three drawn from the SRT socket&#8217;s statistics, published as a ROS 2 topic.</text>
      <text x="74" y="506" font-style="italic" fill="#9B2D20">— in cinnabar: the loss signal, the pulse of the link</text>
    </g>
  </g>
</svg>
