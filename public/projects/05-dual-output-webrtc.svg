<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.13  0 0 0 0 0.11  0 0 0 0 0.08  0 0 0 0.05 0"/>
    </filter>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="4.5" height="4.5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4.5" stroke="#211C15" stroke-width="0.55" opacity="0.5"/>
    </pattern>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#211C15"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#9B2D20"/></marker>
  </defs>

  <rect width="960" height="540" fill="#F2EBD9"/>
  <rect width="960" height="540" filter="url(#grain)"/>
  <rect x="14" y="14" width="932" height="512" fill="none" stroke="#211C15" stroke-width="1.4"/>
  <rect x="21" y="21" width="918" height="498" fill="none" stroke="#211C15" stroke-width="0.5"/>
  <g fill="#F2EBD9" stroke="#211C15" stroke-width="1">
    <rect x="10.5" y="10.5" width="7" height="7"/><rect x="942.5" y="10.5" width="7" height="7"/>
    <rect x="10.5" y="522.5" width="7" height="7"/><rect x="942.5" y="522.5" width="7" height="7"/>
  </g>

  <g fill="#211C15">
    <line x1="55" y1="57" x2="195" y2="57" stroke="#211C15" stroke-width="0.7"/>
    <line x1="765" y1="57" x2="905" y2="57" stroke="#211C15" stroke-width="0.7"/>
    <text x="480" y="62" text-anchor="middle" font-size="16" letter-spacing="2.5" style="font-variant:small-caps">Plate V — Dual-Output Camera &amp; Mosaic</text>
    <line x1="400" y1="76" x2="560" y2="76" stroke="#211C15" stroke-width="0.6"/>
    <circle cx="480" cy="76" r="1.6"/>
  </g>

  <g filter="url(#rough)" stroke="#211C15" fill="none" stroke-linecap="round">
    <!-- cameras -->
    <g stroke="none">
      <rect x="48.5" y="108.5" width="110" height="38" fill="url(#hatch)"/>
      <rect x="48.5" y="161.5" width="110" height="38" fill="url(#hatch)"/>
      <rect x="48.5" y="214.5" width="110" height="38" fill="url(#hatch)"/>
      <rect x="218.5" y="146.5" width="155" height="58" fill="url(#hatch)"/>
      <rect x="458.5" y="91.5" width="190" height="50" fill="url(#hatch)"/>
      <rect x="433.5" y="216.5" width="180" height="50" fill="url(#hatch)"/>
      <rect x="663.5" y="216.5" width="150" height="50" fill="url(#hatch)"/>
    </g>
    <rect x="45" y="105" width="110" height="38" fill="#F2EBD9" stroke-width="1.1"/>
    <rect x="45" y="158" width="110" height="38" fill="#F2EBD9" stroke-width="1.1"/>
    <rect x="45" y="211" width="110" height="38" fill="#F2EBD9" stroke-width="1.1"/>
    <rect x="215" y="143" width="155" height="58" fill="#F2EBD9" stroke-width="1.1"/>
    <line x1="155" y1="124" x2="213" y2="158" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="155" y1="177" x2="213" y2="174" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="155" y1="230" x2="213" y2="192" stroke-width="1" marker-end="url(#arr)"/>
    <!-- path A: the pulse -->
    <rect x="455" y="88" width="190" height="50" fill="#F2EBD9" stroke="#9B2D20" stroke-width="1.4"/>
    <line x1="370" y1="158" x2="452" y2="120" stroke="#9B2D20" stroke-width="1.4" marker-end="url(#arrR)"/>
    <line x1="645" y1="112" x2="748" y2="108" stroke="#9B2D20" stroke-width="1.4" marker-end="url(#arrR)"/>
    <!-- operator monitor icon -->
    <rect x="752" y="82" width="88" height="52" stroke-width="1.2"/>
    <line x1="782" y1="134" x2="812" y2="134" stroke-width="1.2"/>
    <line x1="797" y1="134" x2="797" y2="142" stroke-width="1.2"/>
    <line x1="777" y1="142" x2="817" y2="142" stroke-width="1.2"/>
    <!-- path B -->
    <rect x="430" y="213" width="180" height="50" fill="#F2EBD9" stroke-width="1.1"/>
    <rect x="660" y="213" width="150" height="50" fill="#F2EBD9" stroke-width="1.1"/>
    <line x1="370" y1="185" x2="427" y2="222" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="610" y1="238" x2="658" y2="238" stroke-width="1" marker-end="url(#arr)"/>
    <rect x="855" y="210" width="62" height="46" stroke-width="1.1"/>
    <line x1="855" y1="222" x2="917" y2="222" stroke-width="0.7"/>
    <circle cx="862" cy="216" r="1.8"/><circle cx="870" cy="216" r="1.8"/>
    <line x1="810" y1="238" x2="852" y2="234" stroke-width="1" marker-end="url(#arr)"/>
    <!-- mosaic mockup -->
    <rect x="560" y="315" width="330" height="190" stroke-width="1.2"/>
    <line x1="560" y1="340" x2="890" y2="340" stroke-width="0.8"/>
    <circle cx="573" cy="328" r="2.6"/><circle cx="585" cy="328" r="2.6"/><circle cx="597" cy="328" r="2.6"/>
    <rect x="576" y="352" width="145" height="68" stroke-width="0.9"/>
    <rect x="732" y="352" width="140" height="68" stroke-width="0.9"/>
    <rect x="576" y="428" width="145" height="64" stroke-width="0.9"/>
    <rect x="732" y="428" width="140" height="64" stroke-width="0.9"/>
    <g stroke-width="0.9">
      <rect x="630" y="378" width="24" height="15"/><path d="M654 382 L664 378 L664 393 L654 389 z"/>
      <rect x="784" y="378" width="24" height="15"/><path d="M808 382 L818 378 L818 393 L808 389 z"/>
      <rect x="630" y="450" width="24" height="15"/><path d="M654 454 L664 450 L664 465 L654 461 z"/>
      <rect x="784" y="450" width="24" height="15"/><path d="M808 454 L818 450 L818 465 L808 461 z"/>
    </g>
  </g>

  <g fill="#211C15" text-anchor="middle" style="font-variant:small-caps">
    <text x="100" y="128" font-size="10">Camera 1</text>
    <text x="100" y="181" font-size="10">Camera 2</text>
    <text x="100" y="234" font-size="10">Camera 3</text>
    <text x="292" y="168" font-size="10.5">Capture / encode</text>
    <text x="292" y="184" font-size="10.5">stage — once</text>
    <text x="550" y="108" font-size="10.5" fill="#9B2D20">Operator stream</text>
    <text x="550" y="124" font-size="10" font-style="italic" fill="#9B2D20" style="font-variant:normal">low latency, direct</text>
    <text x="796" y="158" font-size="9.5">operator ui</text>
    <text x="520" y="233" font-size="10.5">Mosaic compositor</text>
    <text x="520" y="249" font-size="10" font-style="italic" style="font-variant:normal">auto grid layout</text>
    <text x="735" y="233" font-size="10.5">WebRTC</text>
    <text x="735" y="249" font-size="10.5">transmission</text>
    <text x="886" y="275" font-size="9.5">remote viewer</text>
  </g>
  <text x="100" y="270" text-anchor="middle" font-size="11" fill="#211C15">&#8942;</text>
  <text x="398" y="115" font-size="9.5" font-style="italic" fill="#9B2D20">path a</text>
  <text x="385" y="215" font-size="9.5" font-style="italic" fill="#211C15">path b</text>
  <text x="725" y="516" text-anchor="middle" font-size="10" font-style="italic" fill="#211C15">fig. — the mosaic, as seen in any browser</text>

  <g fill="#211C15" font-size="14" text-anchor="middle">
    <text x="58" y="99">&#9312;</text>
    <text x="228" y="137">&#9313;</text>
    <text x="467" y="82" fill="#9B2D20">&#9314;</text>
    <text x="443" y="207">&#9315;</text>
    <text x="673" y="207">&#9316;</text>
  </g>

  <g>
    <rect x="45" y="330" width="330" height="130" fill="none" stroke="#211C15" stroke-width="0.6"/>
    <text x="59" y="349" font-size="10" letter-spacing="2" fill="#211C15" style="font-variant:small-caps">Legend.</text>
    <g fill="#211C15" font-size="10" letter-spacing="0.3">
      <text x="59" y="366">&#9312;&#160;&#160;Rover cameras, N feeds</text>
      <text x="59" y="381">&#9313;&#160;&#160;Shared capture &amp; encode — never duplicated</text>
      <text x="59" y="396">&#9314;&#160;&#160;Operator stream, dedicated</text>
      <text x="59" y="411">&#9315;&#160;&#160;Mosaic compositor, nearest-rectangle grid</text>
      <text x="59" y="426">&#9316;&#160;&#160;WebRTC — NAT traversal, browser playback</text>
      <text x="59" y="443" font-style="italic" fill="#9B2D20">— in cinnabar: the operator&#8217;s low-latency path</text>
    </g>
  </g>
</svg>
