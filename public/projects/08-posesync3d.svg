<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.13  0 0 0 0 0.11  0 0 0 0 0.08  0 0 0 0.05 0"/>
    </filter>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="4.5" height="4.5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4.5" stroke="#211C15" stroke-width="0.55" opacity="0.5"/>
    </pattern>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#211C15"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#9B2D20"/></marker>
  </defs>

  <rect width="960" height="540" fill="#F2EBD9"/>
  <rect width="960" height="540" filter="url(#grain)"/>
  <rect x="14" y="14" width="932" height="512" fill="none" stroke="#211C15" stroke-width="1.4"/>
  <rect x="21" y="21" width="918" height="498" fill="none" stroke="#211C15" stroke-width="0.5"/>
  <g fill="#F2EBD9" stroke="#211C15" stroke-width="1">
    <rect x="10.5" y="10.5" width="7" height="7"/><rect x="942.5" y="10.5" width="7" height="7"/>
    <rect x="10.5" y="522.5" width="7" height="7"/><rect x="942.5" y="522.5" width="7" height="7"/>
  </g>

  <g fill="#211C15">
    <line x1="55" y1="57" x2="215" y2="57" stroke="#211C15" stroke-width="0.7"/>
    <line x1="745" y1="57" x2="905" y2="57" stroke="#211C15" stroke-width="0.7"/>
    <text x="480" y="62" text-anchor="middle" font-size="16" letter-spacing="2.5" style="font-variant:small-caps">Plate VIII — PoseSync 3D Pipeline</text>
    <line x1="400" y1="76" x2="560" y2="76" stroke="#211C15" stroke-width="0.6"/>
    <circle cx="480" cy="76" r="1.6"/>
  </g>

  <g filter="url(#rough)" stroke="#211C15" fill="none" stroke-linecap="round">
    <g stroke="none">
      <rect x="38.5" y="123.5" width="110" height="60" fill="url(#hatch)"/>
      <rect x="178.5" y="123.5" width="115" height="60" fill="url(#hatch)"/>
      <rect x="558.5" y="123.5" width="130" height="60" fill="url(#hatch)"/>
      <rect x="723.5" y="123.5" width="125" height="60" fill="url(#hatch)"/>
    </g>
    <rect x="35" y="120" width="110" height="60" fill="#F2EBD9" stroke-width="1.1"/>
    <rect x="175" y="120" width="115" height="60" fill="#F2EBD9" stroke-width="1.1"/>
    <rect x="320" y="96" width="200" height="142" stroke-width="1.1"/>
    <rect x="333" y="126" width="80" height="34" fill="#F2EBD9" stroke-width="0.9"/>
    <rect x="425" y="126" width="82" height="34" fill="#F2EBD9" stroke-width="0.9"/>
    <rect x="348" y="188" width="145" height="34" fill="#F2EBD9" stroke-width="0.9"/>
    <line x1="373" y1="160" x2="405" y2="186" stroke-width="0.9" marker-end="url(#arr)"/>
    <line x1="466" y1="160" x2="436" y2="186" stroke-width="0.9" marker-end="url(#arr)"/>
    <rect x="555" y="120" width="130" height="60" fill="#F2EBD9" stroke-width="1.1"/>
    <rect x="720" y="120" width="125" height="60" fill="#F2EBD9" stroke-width="1.1"/>
    <line x1="145" y1="150" x2="173" y2="150" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="290" y1="150" x2="318" y2="150" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="520" y1="150" x2="553" y2="150" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="685" y1="150" x2="718" y2="150" stroke-width="1" marker-end="url(#arr)"/>
    <!-- the pulse: live data to the viewer -->
    <path d="M 782 180 L 782 262 L 490 262 L 490 286" stroke="#9B2D20" stroke-width="1.5" marker-end="url(#arrR)"/>
    <rect x="368" y="288" width="245" height="38" fill="#F2EBD9" stroke="#9B2D20" stroke-width="1.4"/>
    <!-- dark viewport -->
    <rect x="355" y="352" width="270" height="158" fill="#211C15" stroke-width="1.2"/>
    <line x1="355" y1="373" x2="625" y2="373" stroke="#F2EBD9" stroke-width="0.8"/>
    <circle cx="368" cy="363" r="2.4" stroke="#F2EBD9" stroke-width="0.8"/>
    <circle cx="379" cy="363" r="2.4" stroke="#F2EBD9" stroke-width="0.8"/>
    <circle cx="390" cy="363" r="2.4" stroke="#F2EBD9" stroke-width="0.8"/>
    <g stroke="#F2EBD9" stroke-width="1.3">
      <circle cx="490" cy="398" r="10"/>
      <line x1="490" y1="408" x2="490" y2="448"/>
      <line x1="490" y1="418" x2="462" y2="437"/>
      <line x1="490" y1="418" x2="519" y2="433"/>
      <line x1="490" y1="448" x2="471" y2="488"/>
      <line x1="490" y1="448" x2="510" y2="488"/>
    </g>
    <g fill="#F2EBD9" stroke="none">
      <circle cx="490" cy="418" r="2.3"/><circle cx="462" cy="437" r="2.3"/><circle cx="519" cy="433" r="2.3"/>
      <circle cx="490" cy="448" r="2.3"/><circle cx="471" cy="488" r="2.3"/><circle cx="510" cy="488" r="2.3"/>
    </g>
  </g>

  <g fill="#211C15" text-anchor="middle" style="font-variant:small-caps">
    <text x="90" y="146" font-size="10">Video stream</text>
    <text x="90" y="161" font-size="10">input</text>
    <text x="232" y="146" font-size="10">Flask ingest</text>
    <text x="232" y="161" font-size="10">service</text>
    <text x="420" y="114" font-size="10" letter-spacing="1.2">inference</text>
    <text x="373" y="147" font-size="9.5">YOLOv8</text>
    <text x="466" y="147" font-size="9.5">MediaPipe</text>
    <text x="420" y="209" font-size="9.5">combined detections</text>
    <text x="620" y="146" font-size="10">Async priority</text>
    <text x="620" y="161" font-size="10">task queue</text>
    <text x="782" y="146" font-size="10">SQLite3</text>
    <text x="782" y="161" font-size="10">spatial store</text>
    <text x="490" y="312" font-size="10.5" fill="#9B2D20">Three.js real-time 3-D viewer</text>
  </g>
  <text x="648" y="256" font-size="9.5" font-style="italic" fill="#9B2D20">live spatial data</text>
  <text x="490" y="524" text-anchor="middle" font-size="10" font-style="italic" fill="#211C15">fig. — the living render, white on black</text>

  <g fill="#211C15" font-size="14" text-anchor="middle">
    <text x="47" y="114">&#9312;</text>
    <text x="187" y="114">&#9313;</text>
    <text x="332" y="90">&#9314;</text>
    <text x="567" y="114">&#9315;</text>
    <text x="732" y="114">&#9316;</text>
    <text x="380" y="282" fill="#9B2D20">&#9317;</text>
  </g>

  <g>
    <rect x="45" y="348" width="280" height="128" fill="none" stroke="#211C15" stroke-width="0.6"/>
    <text x="59" y="367" font-size="10" letter-spacing="2" fill="#211C15" style="font-variant:small-caps">Legend.</text>
    <g fill="#211C15" font-size="10" letter-spacing="0.3">
      <text x="59" y="384">&#9312;&#160;&#160;Continuous video input</text>
      <text x="59" y="399">&#9313;&#160;&#160;Flask ingest service</text>
      <text x="59" y="414">&#9314;&#160;&#160;YOLOv8 + MediaPipe, in parallel</text>
      <text x="59" y="429">&#9315;&#160;&#160;Priority task queue, async</text>
      <text x="59" y="444">&#9316;&#160;&#160;Normalised SQLite3 schema</text>
      <text x="59" y="459">&#9317;&#160;&#160;Incremental Three.js render</text>
      <text x="59" y="472" font-style="italic" fill="#9B2D20">— in cinnabar: fresh data reaching the eye</text>
    </g>
  </g>
</svg>
