<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.13  0 0 0 0 0.11  0 0 0 0 0.08  0 0 0 0.05 0"/>
    </filter>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="4.5" height="4.5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4.5" stroke="#211C15" stroke-width="0.55" opacity="0.5"/>
    </pattern>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#211C15"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#9B2D20"/></marker>
  </defs>

  <rect width="960" height="540" fill="#F2EBD9"/>
  <rect width="960" height="540" filter="url(#grain)"/>
  <rect x="14" y="14" width="932" height="512" fill="none" stroke="#211C15" stroke-width="1.4"/>
  <rect x="21" y="21" width="918" height="498" fill="none" stroke="#211C15" stroke-width="0.5"/>
  <g fill="#F2EBD9" stroke="#211C15" stroke-width="1">
    <rect x="10.5" y="10.5" width="7" height="7"/><rect x="942.5" y="10.5" width="7" height="7"/>
    <rect x="10.5" y="522.5" width="7" height="7"/><rect x="942.5" y="522.5" width="7" height="7"/>
  </g>

  <g fill="#211C15">
    <line x1="55" y1="57" x2="205" y2="57" stroke="#211C15" stroke-width="0.7"/>
    <line x1="755" y1="57" x2="905" y2="57" stroke="#211C15" stroke-width="0.7"/>
    <text x="480" y="62" text-anchor="middle" font-size="16" letter-spacing="2.5" style="font-variant:small-caps">Plate II — Adaptive Network Resilience</text>
    <line x1="400" y1="76" x2="560" y2="76" stroke="#211C15" stroke-width="0.6"/>
    <circle cx="480" cy="76" r="1.6"/>
  </g>

  <g filter="url(#rough)" stroke="#211C15" fill="none" stroke-linecap="round">
    <g stroke="none">
      <rect x="403.5" y="98.5" width="180" height="44" fill="url(#hatch)"/>
      <rect x="693.5" y="173.5" width="190" height="44" fill="url(#hatch)"/>
      <rect x="323.5" y="275.5" width="150" height="42" fill="url(#hatch)"/>
      <rect x="495.5" y="275.5" width="140" height="42" fill="url(#hatch)"/>
      <rect x="657.5" y="275.5" width="160" height="42" fill="url(#hatch)"/>
      <rect x="98.5" y="173.5" width="140" height="44" fill="url(#hatch)"/>
    </g>
    <rect x="400" y="95" width="180" height="44" fill="#F2EBD9" stroke-width="1.1"/>
    <rect x="690" y="170" width="190" height="44" fill="#F2EBD9" stroke-width="1.1"/>
    <rect x="320" y="272" width="150" height="42" fill="#F2EBD9" stroke-width="1.1"/>
    <rect x="492" y="272" width="140" height="42" fill="#F2EBD9" stroke-width="1.1"/>
    <rect x="654" y="272" width="160" height="42" fill="#F2EBD9" stroke-width="1.1"/>
    <rect x="95" y="170" width="140" height="44" fill="#F2EBD9" stroke-width="1.1"/>
    <!-- detection pulse: red -->
    <line x1="575" y1="130" x2="712" y2="168" stroke="#9B2D20" stroke-width="1.4" marker-end="url(#arrR)"/>
    <line x1="770" y1="214" x2="740" y2="270" stroke="#9B2D20" stroke-width="1.4" marker-end="url(#arrR)"/>
    <line x1="758" y1="214" x2="575" y2="270" stroke="#9B2D20" stroke-width="1.4" marker-end="url(#arrR)"/>
    <line x1="746" y1="214" x2="415" y2="270" stroke="#9B2D20" stroke-width="1.4" marker-end="url(#arrR)"/>
    <!-- corrective arrows: ink -->
    <line x1="352" y1="272" x2="200" y2="216" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="512" y1="288" x2="238" y2="205" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="672" y1="300" x2="240" y2="196" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="175" y1="170" x2="398" y2="120" stroke-width="1" marker-end="url(#arr)"/>
    <!-- chart -->
    <line x1="60" y1="498" x2="548" y2="498" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="60" y1="498" x2="60" y2="382" stroke-width="1" marker-end="url(#arr)"/>
    <polyline points="60,482 190,480 218,410 248,476 400,481 540,482" stroke-width="1.3"/>
    <polyline points="60,404 200,406 252,458 330,460 400,432 470,412 540,408" stroke-width="1.1" stroke-dasharray="5,4"/>
  </g>

  <g fill="#211C15" text-anchor="middle" style="font-variant:small-caps">
    <text x="490" y="122" font-size="11">Network monitor</text>
    <text x="785" y="197" font-size="11">Loss event detected</text>
    <text x="395" y="298" font-size="10.5">I-frame request</text>
    <text x="562" y="298" font-size="10.5">Backoff timer</text>
    <text x="734" y="298" font-size="10.5">Bitrate controller</text>
    <text x="165" y="197" font-size="11">Encoder</text>
  </g>
  <text x="278" y="130" text-anchor="middle" font-size="9.5" font-style="italic" fill="#211C15">observed statistics</text>

  <g fill="#211C15" font-size="14" text-anchor="middle">
    <text x="412" y="90">&#9312;</text>
    <text x="900" y="165">&#9313;</text>
    <text x="332" y="267">&#9314;</text>
    <text x="504" y="267">&#9315;</text>
    <text x="826" y="267">&#9316;</text>
    <text x="107" y="165">&#9317;</text>
  </g>

  <!-- chart labels -->
  <g fill="#211C15" font-size="9.5" font-style="italic">
    <text x="228" y="398">packet loss %</text>
    <text x="300" y="478">bitrate, Mbps</text>
    <text x="552" y="512">time</text>
  </g>

  <g>
    <rect x="610" y="382" width="300" height="128" fill="none" stroke="#211C15" stroke-width="0.6"/>
    <text x="624" y="401" font-size="10" letter-spacing="2" fill="#211C15" style="font-variant:small-caps">Legend.</text>
    <g fill="#211C15" font-size="10" letter-spacing="0.3">
      <text x="624" y="418">&#9312;&#160;&#160;Network monitor</text>
      <text x="624" y="432">&#9313;&#160;&#160;Loss event detected</text>
      <text x="624" y="446">&#9314;&#160;&#160;I-frame (keyframe) request</text>
      <text x="624" y="460">&#9315;&#160;&#160;Exponential backoff timer</text>
      <text x="624" y="474">&#9316;&#160;&#160;Bitrate controller</text>
      <text x="624" y="488">&#9317;&#160;&#160;Encoder</text>
      <text x="624" y="503" font-style="italic" fill="#9B2D20">— in cinnabar: the loss signal, propagating</text>
    </g>
  </g>
</svg>
